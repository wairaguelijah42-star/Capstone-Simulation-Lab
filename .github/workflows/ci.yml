name: DevSecOps Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: secure_api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit safety

      - name: Initialize Database
        run: |
          python init_db.py
      - name: Debug Files
        run: |
          pwd
          find . -maxdepth 3
      - name: Static Code Analysis (Bandit)
        run: |
          bandit  -r . \
          -x secure_api/venv \
          -f txt \
          -o ../bandit-report.txt || true 

          echo "========== BANDIT REPORT =========="
          cat ../bandit-report.txt
      - name: Dependency Scan
        run: |
          safety check -r requirements.txt \
          > ../safety-report.txt

      - name: Secret Detection
        uses: gitleaks/gitleaks-action@v2

      - name: Run Unit Tests
        working-directory: .
        run: |
          pytest ../tests -v | tee ../pytest-report.txt

      - name: Build Docker Image
        working-directory: .
        run: |
          docker build -t secure-api .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-api
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Move Trivy Report
        run: |
          mv trivy-report.txt ..

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-Reports
          path: |
            bandit-report.txt
            safety-report.txt
            pytest-report.txt
            trivy-report.txt
