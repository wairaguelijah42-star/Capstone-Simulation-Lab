name: DevSecOps Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r secure_api/requirements.txt
          pip install bandit safety pytest

      - name: Static Code Analysis (Bandit)
        run: |
          bandit \
            -r secure_api \
            -x secure_api/venv,secure_api/__pycache__,secure_api/logs \
            -f txt \
            -o bandit-report.txt

      - name: Dependency Scanning (Safety)
        run: |
          safety check -r secure_api/requirements.txt > safety-report.txt || true

      - name: Secret Detection
        uses: gitleaks/gitleaks-action@v2

      - name: Unit Testing
        run: |
          python -m pytest tests/ > pytest-report.txt

      - name: Build Docker Image
        run: |
          docker build -t secure-api ./secure_api

      - name: Container Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-api
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: DevSecOps-Reports
          path: |
            bandit-report.txt
            safety-report.txt
            pytest-report.txt
            trivy-report.txt

      - name: Pipeline Completed
        run: echo "DevSecOps Pipeline Completed Successfully"
